<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold">Mi Perfil</h1>
            <button id="logoutBtn" class="bg-red-500 text-white px-4 py-1 rounded">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow p-6 max-w-md mx-auto">
            <h2 class="text-2xl font-bold mb-6 text-center">Mi Información</h2>
            
            <form id="profileForm">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Nombre</label>
                    <input type="text" id="userName" required class="w-full px-3 py-2 border rounded">
                </div>
                
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Email</label>
                    <input type="email" id="userEmail" required class="w-full px-3 py-2 border rounded">
                </div>
                
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Nueva Contraseña</label>
                    <input type="password" id="userPassword" placeholder="Dejar en blanco para no cambiar" class="w-full px-3 py-2 border rounded">
                </div>
                
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Rol</label>
                    <input type="text" id="userRole" disabled class="w-full px-3 py-2 border rounded bg-gray-100">
                </div>
                
                <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded">Actualizar Perfil</button>
            </form>
            
            <div id="message" class="mt-4 text-center hidden"></div>
        </div>
    </div>

    <script type="module" src="src/js/user.js"></script>
</body>
</html>
